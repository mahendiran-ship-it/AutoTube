[project]
name = "autotube-ai"
version = "1.0.0"
description = "Free-first, local-first autonomous YouTube Shorts production pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "PyYAML>=6.0",
  "requests>=2.31",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "Pillow>=10.1",
  "numpy>=1.24",
  "psutil>=5.9",
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
youtube = [
  "google-api-python-client>=2.100",
  "google-auth-oauthlib>=1.1",
  "google-auth-httplib2>=0.2",
]
dev = ["pytest>=7.4", "httpx>=0.25"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
